[project]
name = "annotation-text-streamlit"
version = "0.2.0"
description = "Outil Streamlit d'annotation de texte (NER) à partir de fichiers CSV."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Florian Horellou" }]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "st-annotated-text>=4.0.0",
]

[project.urls]
Repository = "https://github.com/floSa/Annotation-Text-Streamlit"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.0.0",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line-too-long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy (type checking, progressif)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "utils"
disallow_untyped_defs = true
warn_return_any = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers", "--cov=utils", "--cov-report=term-missing"]

[tool.coverage.run]
omit = ["tests/*", "app.py"]
